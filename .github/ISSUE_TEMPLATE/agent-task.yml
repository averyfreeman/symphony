name: Agent task
description: Queue a task for Symphony to work on
title: "[Task]: "
labels: [ready-for-agent]
body:
  - type: markdown
    attributes:
      value: |
        Submitting this issue with the `ready-for-agent` label queues it for Symphony. Remove that label to pause the task; close the issue to cancel it.
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the requested change and relevant context.
      placeholder: What should Symphony do?
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the outcomes that will make this task complete.
      placeholder: |
        - [ ] ...
    validations:
      required: true
